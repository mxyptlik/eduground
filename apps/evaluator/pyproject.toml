[project]
name = "curriculum-tutor-evaluator"
version = "0.1.0"
description = "Offline evaluation harness for grounded tutoring"
requires-python = ">=3.12"
dependencies = [
  "opentelemetry-api>=1.30.0",
  "opentelemetry-sdk>=1.30.0",
  "pydantic>=2.10.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.0",
]

[build-system]
requires = ["setuptools>=69.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "."}

[tool.setuptools.packages.find]
where = ["."]
include = ["app*", "tests*"]
