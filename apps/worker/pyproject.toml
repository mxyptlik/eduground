[project]
name = "curriculum-tutor-worker"
version = "0.1.0"
description = "Background workers for ingestion and maintenance"
requires-python = ">=3.12"
dependencies = [
  "boto3>=1.36.0",
  "dramatiq>=1.17.0",
  "httpx>=0.28.0",
  "opentelemetry-api>=1.30.0",
  "opentelemetry-sdk>=1.30.0",
  "pdfplumber>=0.11.0",
  "psycopg[binary]>=3.2.0",
  "pydantic>=2.10.0",
  "pydantic-settings>=2.7.0",
  "pymupdf>=1.25.0",
  "pypdf>=5.1.0",
  "python-docx>=1.1.0",
  "python-pptx>=1.0.0",
  "redis>=5.0.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.0",
]

[build-system]
requires = ["setuptools>=69.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "."}

[tool.setuptools.packages.find]
where = ["."]
include = ["app*", "tests*"]
