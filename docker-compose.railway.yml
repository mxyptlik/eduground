services:
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      PORT: ${PORT:-8000}
      CURRICULUM_TUTOR_APP_ENV: ${CURRICULUM_TUTOR_APP_ENV:-production}
      CURRICULUM_TUTOR_AUTO_CREATE_SCHEMA: ${CURRICULUM_TUTOR_AUTO_CREATE_SCHEMA:-true}
      CURRICULUM_TUTOR_DATABASE_URL: ${CURRICULUM_TUTOR_DATABASE_URL}
      CURRICULUM_TUTOR_DATABASE_POOL_SIZE: ${CURRICULUM_TUTOR_DATABASE_POOL_SIZE:-20}
      CURRICULUM_TUTOR_DATABASE_MAX_OVERFLOW: ${CURRICULUM_TUTOR_DATABASE_MAX_OVERFLOW:-40}
      CURRICULUM_TUTOR_DATABASE_POOL_TIMEOUT_SECONDS: ${CURRICULUM_TUTOR_DATABASE_POOL_TIMEOUT_SECONDS:-30}
      CURRICULUM_TUTOR_DATABASE_POOL_RECYCLE_SECONDS: ${CURRICULUM_TUTOR_DATABASE_POOL_RECYCLE_SECONDS:-1800}
      CURRICULUM_TUTOR_REDIS_URL: ${CURRICULUM_TUTOR_REDIS_URL}
      CURRICULUM_TUTOR_QDRANT_URL: ${CURRICULUM_TUTOR_QDRANT_URL}
      CURRICULUM_TUTOR_QDRANT_API_KEY: ${CURRICULUM_TUTOR_QDRANT_API_KEY:-}
      CURRICULUM_TUTOR_QDRANT_COLLECTION_NAME: ${CURRICULUM_TUTOR_QDRANT_COLLECTION_NAME:-eduground_chunks}
      CURRICULUM_TUTOR_S3_ENDPOINT: ${CURRICULUM_TUTOR_S3_ENDPOINT}
      CURRICULUM_TUTOR_S3_BUCKET: ${CURRICULUM_TUTOR_S3_BUCKET}
      CURRICULUM_TUTOR_S3_ACCESS_KEY: ${CURRICULUM_TUTOR_S3_ACCESS_KEY}
      CURRICULUM_TUTOR_S3_SECRET_KEY: ${CURRICULUM_TUTOR_S3_SECRET_KEY}
      CURRICULUM_TUTOR_S3_REGION: ${CURRICULUM_TUTOR_S3_REGION:-auto}
      CURRICULUM_TUTOR_S3_USE_SSL: ${CURRICULUM_TUTOR_S3_USE_SSL:-true}
      CURRICULUM_TUTOR_OBJECT_STORAGE_BACKEND: ${CURRICULUM_TUTOR_OBJECT_STORAGE_BACKEND:-auto}
      CURRICULUM_TUTOR_OBJECT_STORAGE_LOCAL_FALLBACK_ENABLED: ${CURRICULUM_TUTOR_OBJECT_STORAGE_LOCAL_FALLBACK_ENABLED:-true}
      CURRICULUM_TUTOR_OBJECT_STORAGE_LOCAL_DIR: ${CURRICULUM_TUTOR_OBJECT_STORAGE_LOCAL_DIR:-/data/eduground-local-storage}
      CURRICULUM_TUTOR_TRUSTED_HOSTS: ${CURRICULUM_TUTOR_TRUSTED_HOSTS}
      CURRICULUM_TUTOR_CORS_ORIGINS: ${CURRICULUM_TUTOR_CORS_ORIGINS}
      CURRICULUM_TUTOR_WEB_BASE_URL: ${CURRICULUM_TUTOR_WEB_BASE_URL}
      CURRICULUM_TUTOR_API_PUBLIC_BASE_URL: ${CURRICULUM_TUTOR_API_PUBLIC_BASE_URL}
      CURRICULUM_TUTOR_CLERK_ENABLED: ${CURRICULUM_TUTOR_CLERK_ENABLED:-true}
      CURRICULUM_TUTOR_CLERK_SECRET_KEY: ${CURRICULUM_TUTOR_CLERK_SECRET_KEY}
      CURRICULUM_TUTOR_CLERK_PUBLISHABLE_KEY: ${CURRICULUM_TUTOR_CLERK_PUBLISHABLE_KEY}
      CURRICULUM_TUTOR_CLERK_JWKS_URL: ${CURRICULUM_TUTOR_CLERK_JWKS_URL}
      CURRICULUM_TUTOR_CLERK_JWT_ISSUER: ${CURRICULUM_TUTOR_CLERK_JWT_ISSUER}
      CURRICULUM_TUTOR_CLERK_WEBHOOK_SIGNING_SECRET: ${CURRICULUM_TUTOR_CLERK_WEBHOOK_SIGNING_SECRET:-}
      CURRICULUM_TUTOR_OPENROUTER_API_KEY: ${CURRICULUM_TUTOR_OPENROUTER_API_KEY}
      CURRICULUM_TUTOR_OPENROUTER_CHAT_MODEL: ${CURRICULUM_TUTOR_OPENROUTER_CHAT_MODEL:-openai/gpt-4.1-mini}
      CURRICULUM_TUTOR_OPENROUTER_EMBEDDING_MODEL: ${CURRICULUM_TUTOR_OPENROUTER_EMBEDDING_MODEL:-openai/text-embedding-3-large}
      CURRICULUM_TUTOR_UNSTRUCTURED_API_KEY: ${CURRICULUM_TUTOR_UNSTRUCTURED_API_KEY:-}
    volumes:
      - object_storage_fallback:/data/eduground-local-storage

  worker:
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
    environment:
      CURRICULUM_TUTOR_DATABASE_URL: ${CURRICULUM_TUTOR_DATABASE_URL}
      CURRICULUM_TUTOR_REDIS_URL: ${CURRICULUM_TUTOR_REDIS_URL}
      CURRICULUM_TUTOR_QDRANT_URL: ${CURRICULUM_TUTOR_QDRANT_URL}
      CURRICULUM_TUTOR_QDRANT_API_KEY: ${CURRICULUM_TUTOR_QDRANT_API_KEY:-}
      CURRICULUM_TUTOR_QDRANT_COLLECTION_NAME: ${CURRICULUM_TUTOR_QDRANT_COLLECTION_NAME:-eduground_chunks}
      CURRICULUM_TUTOR_S3_ENDPOINT: ${CURRICULUM_TUTOR_S3_ENDPOINT}
      CURRICULUM_TUTOR_S3_BUCKET: ${CURRICULUM_TUTOR_S3_BUCKET}
      CURRICULUM_TUTOR_S3_ACCESS_KEY: ${CURRICULUM_TUTOR_S3_ACCESS_KEY}
      CURRICULUM_TUTOR_S3_SECRET_KEY: ${CURRICULUM_TUTOR_S3_SECRET_KEY}
      CURRICULUM_TUTOR_S3_REGION: ${CURRICULUM_TUTOR_S3_REGION:-auto}
      CURRICULUM_TUTOR_S3_USE_SSL: ${CURRICULUM_TUTOR_S3_USE_SSL:-true}
      CURRICULUM_TUTOR_OBJECT_STORAGE_BACKEND: ${CURRICULUM_TUTOR_OBJECT_STORAGE_BACKEND:-auto}
      CURRICULUM_TUTOR_OBJECT_STORAGE_LOCAL_FALLBACK_ENABLED: ${CURRICULUM_TUTOR_OBJECT_STORAGE_LOCAL_FALLBACK_ENABLED:-true}
      CURRICULUM_TUTOR_OBJECT_STORAGE_LOCAL_DIR: ${CURRICULUM_TUTOR_OBJECT_STORAGE_LOCAL_DIR:-/data/eduground-local-storage}
      CURRICULUM_TUTOR_OPENROUTER_API_KEY: ${CURRICULUM_TUTOR_OPENROUTER_API_KEY}
      CURRICULUM_TUTOR_OPENROUTER_EMBEDDING_MODEL: ${CURRICULUM_TUTOR_OPENROUTER_EMBEDDING_MODEL:-openai/text-embedding-3-large}
      CURRICULUM_TUTOR_UNSTRUCTURED_API_KEY: ${CURRICULUM_TUTOR_UNSTRUCTURED_API_KEY:-}
      CURRICULUM_TUTOR_WORKER_PROCESSES: ${CURRICULUM_TUTOR_WORKER_PROCESSES:-2}
      CURRICULUM_TUTOR_WORKER_THREADS: ${CURRICULUM_TUTOR_WORKER_THREADS:-4}
    depends_on:
      - api
    volumes:
      - object_storage_fallback:/data/eduground-local-storage

  scheduler:
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
    command: python -m app.jobs.scheduler
    environment:
      CURRICULUM_TUTOR_DATABASE_URL: ${CURRICULUM_TUTOR_DATABASE_URL}
      CURRICULUM_TUTOR_REDIS_URL: ${CURRICULUM_TUTOR_REDIS_URL}
      CURRICULUM_TUTOR_MAINTENANCE_INTERVAL_SECONDS: ${CURRICULUM_TUTOR_MAINTENANCE_INTERVAL_SECONDS:-3600}
      CURRICULUM_TUTOR_MAINTENANCE_STARTUP_DELAY_SECONDS: ${CURRICULUM_TUTOR_MAINTENANCE_STARTUP_DELAY_SECONDS:-30}
    depends_on:
      - api

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL}
        VITE_CLERK_PUBLISHABLE_KEY: ${VITE_CLERK_PUBLISHABLE_KEY}
    environment:
      PORT: ${PORT:-8080}
    depends_on:
      - api

volumes:
  object_storage_fallback:
